apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-service-config
  namespace: ecommerce
data:
  SPRING_CLOUD_CONFIG_URI: http://config-server:8888
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/inventory-service?createDatabaseIfNotExist=true
  SPRING_DATASOURCE_USERNAME: root
  KAFKA_BOOTSTRAP_SERVERS: broker:29092
---
apiVersion: v1
kind: Secret
metadata:
  name: inventory-service-secret
  namespace: ecommerce
type: Opaque
data:
  SPRING_DATASOURCE_PASSWORD: cm9vdA== # base64 encoded "root"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
      - name: inventory-service
        image: firasmahjoubi/inventory-service:latest
        ports:
        - containerPort: 8091
        envFrom:
        - configMapRef:
            name: inventory-service-config
        - secretRef:
            name: inventory-service-secret
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8091
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8091
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: ecommerce
spec:
  selector:
    app: inventory-service
  ports:
  - port: 8091
    targetPort: 8091
  type: ClusterIP
