spring.application.name=refund-service
server.port=8085

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Order Service Configuration (via Eureka service discovery)
order.service.url=order-service

# Product Service Configuration (via Eureka service discovery)
product.service.url=product-service

### DATABASE ###
spring.datasource.url=jdbc:mysql://localhost:3306/refund-service?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

### JPA / HIBERNATE ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto= update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

logging.level.root = info